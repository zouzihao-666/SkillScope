[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "skillscope"
version = "0.1.0"
description = "Experiment planning and phase-scoped skill inspection for agent harness research"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.10,<3", "typer>=0.15,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
skillscope = "skillscope.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
