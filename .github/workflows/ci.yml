name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev]" -c requirements-dev.lock
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest -q
      - run: python -m skillscope check
      - run: python -m skillscope plan --output results/ci-plan.json
      - if: runner.os == 'Linux'
        run: python -m skillscope sandbox-build --docker docker
      - if: runner.os == 'Linux'
        run: python -m pytest tests/test_sandbox_integration.py -q
        env:
          SKILLSCOPE_TEST_DOCKER: docker
